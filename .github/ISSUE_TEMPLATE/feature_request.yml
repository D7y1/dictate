name: Feature idea
description: Something Dictate should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The review you were giving and where Dictate got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work. Adding a note should stay one key, so say how yours fits around that.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
